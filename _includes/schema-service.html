{% if page.layout == 'service' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Service",
  "name": "{{ page.title | strip_html | escape }}",
  "description": "{{ page.description | strip_html | escape }}",
  "provider": {
    "@type": "Organization",
    "name": "GetPEC mbH",
    "url": "https://getpec.de"
  },
  "areaServed": {
    "@type": "Country",
    "name": "Deutschland"
  },
  "url": "{{ page.url | absolute_url }}"
}
</script>

{% if page.faq %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {% for item in page.faq %}
    {
      "@type": "Question",
      "name": "{{ item.question | escape }}",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "{{ item.answer | escape }}"
      }
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>
{% endif %}
{% endif %}
